<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Special+Elite&amp;display=swap');
    </style>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc0000"/>
      <stop offset="100%" style="stop-color:#880000"/>
    </linearGradient>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top horizontal rule (red) -->
  <rect x="20" y="18" width="560" height="2" fill="url(#redGrad)" rx="1"/>

  <!-- Decorative corner marks -->
  <rect x="20" y="18" width="14" height="2" fill="#cc0000"/>
  <rect x="20" y="18" width="2" height="14" fill="#cc0000"/>
  <rect x="566" y="18" width="14" height="2" fill="#cc0000"/>
  <rect x="578" y="18" width="2" height="14" fill="#cc0000"/>
  <rect x="20" y="140" width="14" height="2" fill="#cc0000"/>
  <rect x="20" y="128" width="2" height="14" fill="#cc0000"/>
  <rect x="566" y="140" width="14" height="2" fill="#cc0000"/>
  <rect x="578" y="128" width="2" height="14" fill="#cc0000"/>

  <!-- Bottom horizontal rule (red) -->
  <rect x="20" y="140" width="560" height="2" fill="url(#redGrad)" rx="1"/>

  <!-- MOTO wordmark -->
  <text
    x="300"
    y="100"
    text-anchor="middle"
    font-family="'Special Elite', serif"
    font-size="82"
    fill="#e8d5b0"
    letter-spacing="18"
    filter="url(#subtleGlow)">MOTO</text>

  <!-- MEET — smaller, red, spaced, centered below -->
  <text
    x="300"
    y="128"
    text-anchor="middle"
    font-family="'Special Elite', serif"
    font-size="22"
    fill="#cc0000"
    letter-spacing="22"
    filter="url(#redGlow)">MEET</text>

  <!-- Small diamond separators flanking MEET -->
  <polygon points="82,121 88,127 82,133 76,127" fill="#cc0000" opacity="0.7"/>
  <polygon points="518,121 524,127 518,133 512,127" fill="#cc0000" opacity="0.7"/>

  <!-- Thin center divider line between MOTO and MEET -->
  <rect x="100" y="107" width="400" height="1" fill="#cc0000" opacity="0.3" rx="0.5"/>

</svg>
